# CI definition (shipped as a doc, not .github/workflows/, because the push
# integration used for this repo lacks the Workflows permission).
# To activate: move this file to .github/workflows/ci.yml.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest -q
      - run: python demo.py
